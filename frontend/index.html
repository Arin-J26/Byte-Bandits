<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Strict CSP: only same-origin scripts/styles, API calls to same origin. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Sniffer · Trust Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%2322d3ee' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2322d3ee'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="route-progress" class="route-progress" aria-hidden="true"></div>
  <header class="topbar" role="banner">
    <div class="brand">
      <a class="brand-link" href="#/home" aria-label="Sniffer overview"><span class="brand-mark" aria-hidden="true"></span></a>
      <span class="brand-name">Sniffer</span>
      <span class="brand-sub">Trust Command Center</span>
    </div>
    <span id="mode-badge" class="badge badge-mode" role="status" aria-live="polite">Connecting…</span>
    <span id="ai-badge" class="badge badge-mode" role="status" hidden></span>
    <div class="topbar-controls">
      <button id="palette-btn" class="btn btn-ghost palette-trigger" type="button" aria-label="Open command palette (Ctrl or Cmd + K)" aria-keyshortcuts="Control+K Meta+K">
        <span aria-hidden="true">⌕</span><span class="palette-trigger-text">Search or jump to…</span><kbd>⌘K</kbd>
      </button>
      <button id="mute-btn" class="btn btn-icon" type="button" aria-pressed="false" aria-label="Mute sound">
        <span aria-hidden="true" class="ico-sound">🔊</span>
      </button>
      <label class="volume">
        <span class="sr-only">Volume</span>
        <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="Sound volume">
      </label>
      <button id="theme-btn" class="btn btn-icon" type="button" aria-pressed="false" aria-label="Switch to dark theme">
        <span aria-hidden="true">☾</span>
      </button>
      <button id="quiet-btn" class="btn" type="button" aria-pressed="false"
              title="No sound and reduced motion">Quiet mode</button>
      <button id="help-btn" class="btn btn-icon" type="button" aria-label="Keyboard shortcuts (?)">?</button>
      <button id="demo-btn" class="btn btn-primary" type="button">▶ Start demo</button>
    </div>
  </header>

  <nav class="sidebar" aria-label="Main">
    <ul>
      <li><a href="#/home" data-route="home"><span aria-hidden="true">⌂</span> Overview <kbd>g h</kbd></a></li>
      <li><a href="#/graph" data-route="graph"><span aria-hidden="true">◎</span> Graph <kbd>g g</kbd></a></li>
      <li><a href="#/evaluate" data-route="evaluate"><span aria-hidden="true">⚖</span> Evaluate <kbd>g e</kbd></a></li>
      <li><a href="#/campaigns" data-route="campaigns"><span aria-hidden="true">⌖</span> Campaigns <kbd>g c</kbd></a></li>
      <li><a href="#/records" data-route="records"><span aria-hidden="true">☰</span> Records <kbd>g r</kbd></a></li>
      <li><a href="#/trust" data-route="trust"><span aria-hidden="true">⇄</span> Trust <kbd>g t</kbd></a></li>
      <li><a href="#/simulate" data-route="simulate"><span aria-hidden="true">⚙</span> Simulate <kbd>g s</kbd></a></li>
    </ul>
    <section class="glossary" aria-labelledby="glossary-h">
      <h2 id="glossary-h">Glossary</h2>
      <p>Hover or focus a term.</p>
      <ul class="glossary-terms">
        <li><span class="term" tabindex="0" data-term="vouch">vouch</span></li>
        <li><span class="term" tabindex="0" data-term="denounce">denounce</span></li>
        <li><span class="term" tabindex="0" data-term="edge">trust edge</span></li>
        <li><span class="term" tabindex="0" data-term="weight">weight</span></li>
        <li><span class="term" tabindex="0" data-term="decay">decay</span></li>
        <li><span class="term" tabindex="0" data-term="depth">depth</span></li>
      </ul>
    </section>
  </nav>

  <div id="banner" class="banner" role="alert" hidden></div>
  <main id="main" class="main" tabindex="-1">
    <noscript><p class="panel">Sniffer needs JavaScript to run.</p></noscript>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="drawer-root"></div>
  <div id="overlay-root"></div>

  <script src="vendor/cytoscape.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
