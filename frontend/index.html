<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Sniffer · Maintainer portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%230e7490' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230e7490'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Sniffer dashboard">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Sniffer</span>
    </a>
    <span id="conn-badge" class="badge" role="status" aria-live="polite" hidden></span>
    <span id="ai-badge" class="badge" role="status" hidden></span>
    <div class="topbar-controls">
      <span id="whoami" class="muted"></span>
      <button id="quiet-btn" class="btn" type="button" aria-pressed="false" title="Turns off sound and animation">Quiet mode</button>
      <button id="theme-btn" class="btn btn-icon" type="button" aria-label="Switch to dark theme" aria-pressed="false">☾</button>
      <button id="signout-btn" class="btn" type="button" hidden>Sign out</button>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Project sections" hidden></nav>
  <div id="banner" class="banner" role="alert" hidden></div>
  <main id="main" class="main" tabindex="-1"></main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="overlay-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
